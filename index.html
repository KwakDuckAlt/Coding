/* ---------- value helpers ---------- */
const isNumStr = s => typeof s === 'string' && s.trim() !== '' && isFinite(Number(s));
function num(v) { if (typeof v === 'number') return isFinite(v) ? v : 0; if (typeof v === 'boolean') return v ? 1 : 0; const n = Number(v); return isFinite(n) ? n : 0; }

  speak(text, wait) {

/* ============================================================
 * Blocks A: events, motion, looks, sound, pen, sensing
 * args spec: [kind, default, menuId]  kind: num|str|bool|color|menu
 * run(a, th, rt): a.v/n/s/bl(name), a.sub(name), a.inst

function* waitSec(rt, sec) { const t0 = performance.now(), ms = sec * 1000; yield { wait: ms }; }

function tpos(a, name) {

  if (t === '_mouse_') return { x: rt.mouse.x, y: rt.mouse.y };
  if (t === '_random_') return { x: rnd(-rt.W / 2, rt.W / 2), y: rnd(-rt.H / 2, rt.H / 2) };

}
function tinst(a, name) { const t = a.s(name); const o = a.rt.findInst(t, a.inst); if (!o) throw new BSError(`스프라이트 "${t}"을(를) 찾을 수 없습니다.`, a.b.id); return o; }

B('cu_call', 'custom', 'cmd', '(사용자 정의 호출)', {}, function* (a, th, rt) {
  const name = a.b.proc, def = rt.findProc(a.inst, name); if (!def) throw new BSError(`사용자 정의 블록 "${name}"의 정의를 찾을 수 없습니다.`, a.b.id);
  const args = {}; (def.params || []).forEach((p, i) => { args[p] = rt.ev(a.b.i ? a.b.i['p' + i] : '', th, a.b); });
  rt.callDepth = (rt.callDepth || 0); if (th.callDepth === undefined) th.callDepth = 0; if (++th.callDepth > 250) { th.callDepth = 0; throw new BSError(`재귀 호출이 너무 깊습니다 (블록 "${name}").`, a.b.id); }
  th.frames.push(args); const saved = th.cur;
  try { const sig = def.hat.atomic ? yield* rt.atomic(rt.execStack(def.hat.n, th)) : yield* rt.execStack(def.hat.n, th); th.cur = saved; if (sig === 'stop-proc') return; return sig === 'stop' ? undefined : undefined; }
  finally { th.frames.pop(); th.callDepth--; }

  if (th.callDepth === undefined) th.callDepth = 0; if (++th.callDepth > 250) { th.callDepth = 0; throw new BSError(`재귀 호출이 너무 깊습니다 (블록 "${name}").`, a.b.id); }
  th.frames.push(args); const savedRet = th.ret; th.ret = undefined;
  try { rt.runSync(rt.execStack(def.hat.n, th), th); return th.ret === undefined ? '' : th.ret; } finally { th.frames.pop(); th.callDepth--; th.ret = savedRet; }

Runtime.prototype.findProc = function (inst, name) {
  const cand = [inst.def].concat(this.p.sprites.filter(s => s !== inst.def), [this.p.stage]);
  for (const d of cand) for (const sc of d.scripts || []) if (sc.b && sc.b.t === 'cu_def' && sc.b.proc === name) return { hat: sc.b, params: sc.b.params || [], reporter: !!sc.b.reporter };
  return null;
};

/* '화면 새로고침 없이 실행' custom blocks: loop frames inside are skipped, so the whole block runs in one go.
   Waits/promises still pass through; every ~8ms of pure computation one frame is given back so Stop and the UI never freeze. */
Runtime.prototype.atomic = function* (g) {
  let t0 = performance.now(), n = 0;
  try {
    for (;;) {
      const r = g.next(); if (r.done) return r.value; const v = r.value;
      if (v === 'f') { if ((++n & 255) === 0 && performance.now() - t0 > 8) { yield 'f'; t0 = performance.now(); } continue; }
      yield v; t0 = performance.now();
    }
  } finally { try { g.return(); } catch (_) { } }
};

/* ============================================================
 * Project model: create / validate / helpers (shared with export)
 * ============================================================ */
const MAX_PROJECT_BYTES = 60 * 1024 * 1024;
function newId() { return uid(); }
function costumeFromLib(c) { return { name: c.name, data: c.data, w: c.w, h: c.h, cx: c.cx, cy: c.cy, res: 1, svg: c.svg }; }
function spriteFromLib(item, x, y, usedNames) {
  let name = item.name, k = 2; while (usedNames && usedNames.includes(name)) name = item.name + (k++);
  return { id: newId(), name, x: x || 0, y: y || 0, dir: 90, size: 100, visible: true, rot: 'all', cos: 0, layer: 0, locked: false,
    costumes: item.costumes.map(costumeFromLib), sounds: [], scripts: [], vars: [], lists: [], phys: {} };
}
function backdropFromLib(b) { return { name: b.name, data: svgURI(b.svg), svg: b.svg }; }
function newProject(name) {
  const find = n => LIB.sprites.find(s => s.name === n);
  const sp = spriteFromLib(find('고양이'), 0, 0, []);
  return { v: BSX_VERSION, id: newId(), name: name || '내 프로젝트', desc: '', author: '', created: Date.now(), modified: Date.now(),
    stage: { w: 480, h: 360, backdrops: [backdropFromLib(LIB.backdrops.find(b => b.name === '흰색'))], cur: 0, sounds: [], scripts: [] },
    sprites: [sp], vars: [], lists: [], msgs: ['메시지1'], favorites: [], settings: { allowNet: false, allowFull: true, startScreen: true, loading: true, author: '' } };
}
/* validate + normalise an imported project; throws Error with Korean message */
function validateProject(p) {
  if (!p || typeof p !== 'object') throw new Error('프로젝트 데이터가 올바르지 않습니다.');
  if (typeof p.v !== 'number') throw new Error('버전 정보가 없는 파일입니다.');
  if (p.v > BSX_VERSION) throw new Error('더 새로운 버전의 프로젝트입니다. 앱을 업데이트하세요.');
  if (!p.stage || typeof p.stage !== 'object') throw new Error('무대 정보가 없습니다.');
  if (!Array.isArray(p.sprites)) throw new Error('스프라이트 목록이 없습니다.');
  const st = p.stage; st.w = clamp(Math.round(num(st.w) || 480), 120, 1920); st.h = clamp(Math.round(num(st.h) || 360), 90, 1440);
  st.backdrops = Array.isArray(st.backdrops) ? st.backdrops : []; st.sounds = Array.isArray(st.sounds) ? st.sounds : []; st.scripts = Array.isArray(st.scripts) ? st.scripts : [];

/* ---------- pointer handling on workspace ---------- */

  });

/* ---------- click to run ---------- */
Ed.clickRun = function (id) {
  const ent = Ed.idx.get(id); if (!ent) return; const sh = shapeOf(ent.b);

  let top = ent.b, e = ent; while (e && e.key !== 'root') { e = e.parent ? Ed.idx.get(e.parent.id) : null; if (e) top = e.b; }
  App.runScript(top, Ed.target);

/* ---------- selection ops / clipboard ---------- */
Ed.selectedBlocks = function () { return [...Ed.sel].map(i => Ed.idx.get(i)).filter(Boolean); };

    else if (e.key === 'n') { e.parent.n = nx || null; }

/* ---------- context menu ---------- */

/* ---------- keyboard ---------- */

Exp.dataToBytes = function (url) { url = String(url || ''); const c = url.indexOf(','); if (!/^data:/i.test(url) || c < 0) return { mime: '', bytes: new Uint8Array() }; const head = url.slice(5, c), body = url.slice(c + 1), mime = head.split(';')[0]; if (/;base64$/i.test(head)) { const bin = atob(body); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return { mime, bytes: u }; } let t; try { t = decodeURIComponent(body); } catch (_) { t = body; } return { mime, bytes: new TextEncoder().encode(t) }; };

const Share = {};
Share.makeLink = async function () {
  if (!window.CompressionStream) throw new Error('이 브라우저는 링크 압축을 지원하지 않습니다. 파일로 공유하세요.');
  const P = deepClone(App.project); delete P.favorites; delete P.breaks; const txt = JSON.stringify(P); const cs = new Blob([txt]).stream().pipeThrough(new CompressionStream('deflate-raw')); const buf = new Uint8Array(await new Response(cs).arrayBuffer());
  let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000)); const b64 = btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return { url: location.href.split('#')[0] + '#p=' + b64, size: b64.length };
};
Share.loadFromHash = async function () {
  const m = /^#p=([A-Za-z0-9_-]+)$/.exec(location.hash); if (!m) return false; if (!window.DecompressionStream) { App.toast('이 브라우저는 공유 링크를 열 수 없습니다', 'err'); return false; }
  try { const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/'); const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); const ds = new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw')); const txt = await new Response(ds).text(); const p = JSON.parse(txt); p.id = newId(); history.replaceState(null, '', location.pathname + location.search); return App.loadProject(p); } catch (e) { App.toast('공유 링크를 읽지 못했습니다: ' + e.message, 'err'); return false; }
};

/* ---------- engine: build / scan / grade ---------- */
Puz.build = function (p) {
  const P = exProject('퍼즐: ' + p.title, p.goal, '흰색', [], []);
  vspec(p.vars).forEach(v => P.vars.push({ name: v.name, value: v.value, visible: true }));
  (p.lists || []).forEach(l => P.lists.push({ name: l[0], value: l[1].slice(), visible: true }));
  (p.msgs || []).forEach(m => { if (!P.msgs.includes(m)) P.msgs.push(m); });
  addSp(P, '노란 공', '주인공', 0, 0, [], { size: 80 });
  if (p.extra) p.extra(P);
  P.settings.puzzle = p.id; return P;
};
Puz.allows = t => !Puz.cur || !Puz.cur.allow.length || Puz.cur.allow.includes(t);
Puz.scan = function (P) {
  const cnt = {}; let stmts = 0; const s = P.sprites[0]; if (!s) return { cnt, stmts };
  const walk = b => { for (; b; b = b.n) { cnt[b.t] = (cnt[b.t] || 0) + 1; const d = BLOCKS[b.t]; if (d && ['cmd', 'cap', 'c', 'c2', 'c3'].includes(d.shape)) stmts++; if (b.i) for (const k in b.i) { const v = b.i[k]; if (v && typeof v === 'object') walk(v); } if (b.s) for (const k in b.s) walk(b.s[k]); } };
  (s.scripts || []).forEach(sc => walk(sc.b)); return { cnt, stmts };
};
Puz.blabel = t => { const d = BLOCKS[t]; return d ? d.label.replace(/\[\w+\]/g, '□') : t; };
Puz.sleep = ms => new Promise(r => setTimeout(r, ms));
Puz.idle = async function (rt, max) { await Puz.sleep(180); const t0 = performance.now(); while (performance.now() - t0 < max && rt.threads.some(t => !t.done)) await Puz.sleep(40); await Puz.sleep(60); };
Puz.runCase = async function (c) {
  const rt = App.ensureRuntime(); rt.overrides = c.over || null; rt.overrideLists = c.overL || null; const errs = []; const prev = rt.host.onError;
  try {
    await App.run(); rt.speed = c.speed || 1; rt.host.onError = (e, id) => { errs.push(e.message || String(e)); prev && prev(e, id); };
    for (const st of c.steps) {
      if (st.keys) for (const k of st.keys) { rt.keys[k] = true; rt._keyEdges.push(k); await Puz.sleep(st.hold || 120); rt.keys[k] = false; }
      if (st.click) { const s = rt.insts.find(i => i.name === st.click && !i.isClone); if (s) { rt.mouse.x = s.x; rt.mouse.y = s.y; rt.stageClick(); } await Puz.sleep(60); }
      if (st.ask !== undefined) { const t0 = performance.now(); let inp; while (performance.now() - t0 < 3000 && !(inp = document.querySelector('.bsx-ask input'))) await Puz.sleep(50); if (inp) { inp.value = st.ask; inp.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); const ok = document.querySelector('.bsx-ask button'); if (ok) ok.click(); } else return '묻기 입력창이 나타나지 않았어요. 묻고 기다리기 블록을 썼나요?'; }
      if (st.wait) await Puz.sleep(st.wait); else await Puz.idle(rt, st.max || 4000);
      if (errs.length) return '실행 중 오류: ' + errs[0];
      const m = st.test ? st.test(rt) : null; if (m) return m;
    }
    return null;
  } finally { rt.host.onError = prev; rt.overrides = null; rt.overrideLists = null; App.stop(); }
};
Puz.grade = async function (opts) {
  opts = opts || {}; const p = Puz.cur; if (!p || Puz.busy) return null; Puz.busy = true; const fails = [];
  try {
    const sc = Puz.scan(App.project); const bad = Object.keys(sc.cnt).filter(t => !Puz.allows(t));
    bad.forEach(t => fails.push(`이 퍼즐에서 쓸 수 없는 블록: "${Puz.blabel(t)}"`));
    const tally = {}; p.need.forEach(t => tally[t] = (tally[t] || 0) + 1);
    for (const t in tally) if ((sc.cnt[t] || 0) < tally[t]) fails.push(`꼭 써야 하는 블록이 부족해요: "${Puz.blabel(t)}"` + (tally[t] > 1 ? ` ${tally[t]}개 필요` : ''));
    if (sc.stmts > p.limit) fails.push(`명령 블록이 너무 많아요: ${sc.stmts}개 (최대 ${p.limit}개)`);
    if (!sc.stmts && !(sc.cnt.ev_flag || sc.cnt.ev_key || sc.cnt.ev_click)) fails.push('아직 블록이 없어요. 모자 블록부터 시작해 보세요.');
    if (!fails.length) {
      let i = 0; for (const c of p.cases) { i++; const m = await Puz.runCase(c); if (m) { const lab = c.over ? ' (' + Object.entries(c.over).map(([k, v]) => k + '=' + v).join(', ') + ')' : c.overL ? ' (' + Object.entries(c.overL).map(([k, v]) => k + '=[' + v.join(',') + ']').join(', ') + ')' : ''; fails.push(`시험 ${i}/${p.cases.length}${lab}: ${m}`); break; } }
    }
  } catch (e) { fails.push('채점 중 오류: ' + e.message); }
  Puz.busy = false; const ok = !fails.length;
  if (ok) { const S = App.settings, k = p.lesson ? 'tutorialsDone' : 'puzzlesDone'; S[k] = S[k] || {}; if (!S[k][p.id]) { S[k][p.id] = Date.now(); App.saveSettings(); } Learn.check(); }
  Puz.bar();
  if (!opts.silent) Puz.result(ok, fails);
  return { ok, fails };
};
Puz.result = function (ok, fails) {
  const p = Puz.cur, arr = p.lesson ? LESSONS.map(l => l.practice) : PUZZLES, nx = arr[arr.indexOf(p) + 1]; const b = el('div');
  b.innerHTML = ok ? `<p style="font-size:16px">🎉 <b>통과!</b> 모든 시험을 통과했어요.</p><p class="hint">${arr.filter(x => (App.settings[p.lesson ? 'tutorialsDone' : 'puzzlesDone'] || {})[x.id]).length} / ${arr.length} ${p.lesson ? '과정' : '퍼즐'} 완료</p>` : `<p><b>아직이에요.</b></p><ul>${fails.map(f => `<li>${esc(f)}</li>`).join('')}</ul><p class="hint">힌트 버튼을 눌러 보세요.</p>`;
  App.modal({ title: ok ? '퍼즐 통과' : '채점 결과', body: b, buttons: ok ? [{ text: '닫기' }].concat(nx ? [{ text: '다음 퍼즐 ▶', cls: 'pri', fn: () => { Puz.start(nx.id); } }] : []) : [{ text: '닫기', cls: 'pri' }] });
};
Puz.bar = function () {
  const bar = document.getElementById('puzbar'); if (!bar) return; const p = Puz.cur; if (!p) { bar.style.display = 'none'; return; }
  const sc = Puz.scan(App.project), done = (App.settings[p.lesson ? 'tutorialsDone' : 'puzzlesDone'] || {})[p.id];
  bar.style.display = 'block';
  if (Puz.fold) { bar.innerHTML = `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b>${p.lesson ? '📘' : '🧩'} ${esc(p.title)}</b>${done ? ' ✅' : ''}<span class="hint">블록 ${sc.stmts}/${p.limit}</span><span style="flex:1"></span><button class="btn pri" data-a="grade">✔ 채점</button><button class="btn" data-a="fold">▾ 펼치기</button></div>`; return; }
  bar.innerHTML = `<b>${p.lesson ? '📘' : '🧩'} ${PLV[p.lv]} · ${esc(p.title)}</b>${done ? ' ✅' : ''}<div style="margin-top:4px">${esc(p.goal)}</div><div class="hint" style="margin-top:4px">명령 블록 <b style="color:${sc.stmts > p.limit ? '#dc2626' : 'inherit'}">${sc.stmts}</b> / ${p.limit}${p.limit >= 99 ? '' : ' 이하'}</div><div class="row2"><button class="btn pri" data-a="grade">✔ 채점</button><button class="btn" data-a="hint">💡 힌트</button><button class="btn" data-a="reset">↺ 처음부터</button><button class="btn" data-a="list">목록</button><button class="btn" data-a="fold">▴ 접기</button><button class="btn" data-a="exit">✕ 종료</button></div>`;
};
Puz.start = async function (id) {
  const p = Puz.find(id); if (!p) return; try { if (App.dirty && document.body.classList.contains('in-editor')) await App.save(false); } catch (_) { }
  const P = Puz.build(p); P.id = newId(); App.loadProject(P); App.toast('🧩 ' + p.title + ' — 목표를 읽고 블록을 조립한 뒤 ✔ 채점을 누르세요');
};
Puz.sync = function () {
  const id = App.project && App.project.settings && App.project.settings.puzzle; Puz.cur = Puz.find(id); Puz.bar(); if (App.project) Pal.render();
};
Puz.exit = function () { if (App.project && App.project.settings) delete App.project.settings.puzzle; Puz.cur = null; Puz.bar(); Pal.render(); App.markDirty(); App.toast('퍼즐 모드를 종료했습니다. 모든 블록을 쓸 수 있어요.'); };
(function () {
  const bar = document.getElementById('puzbar'); if (bar) bar.addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (!a || !Puz.cur) return; const k = a.dataset.a;
    if (k === 'grade') Puz.grade(); else if (k === 'hint') App.modal({ title: '💡 힌트', body: `<p>${esc(Puz.cur.hint || '목표를 다시 읽어 보세요.')}</p>`, buttons: [{ text: '닫기', cls: 'pri' }] });
    else if (k === 'reset') App.confirm('이 퍼즐을 처음부터 다시 시작할까요? 만든 블록이 사라집니다.', () => { const P = Puz.build(Puz.cur); P.id = App.project.id; App.loadProject(P); });
    else if (k === 'fold') { Puz.fold = !Puz.fold; Puz.bar(); } else if (k === 'list') (Puz.cur.lesson ? Learn.tutorials() : Learn.puzzles()); else if (k === 'exit') App.confirm('퍼즐 모드를 끝낼까요? (블록은 그대로 남아요)', Puz.exit);
  });
  const lp = App.loadProject; App.loadProject = function () { const r = lp.apply(this, arguments); Puz.sync(); return r; };
  setInterval(() => { if (Puz.cur && !document.hidden) Puz.bar(); }, 1500);

Learn.puzzles = function () {
  const b = el('div'); const S = App.settings, done = S.puzzlesDone || {};
  b.appendChild(el('p', 'hint', `퍼즐마다 쓸 수 있는 블록과 개수가 정해져 있어요. 다 만들면 ✔ 채점을 누르세요. 채점은 프로그램을 실제로 여러 번(값을 바꿔 가며) 실행해서 확인합니다. (${Learn.count(done)} / ${PUZZLES.length} 해결)`));
  for (let lv = 1; lv <= 5; lv++) {
    const ps = PUZZLES.filter(p => p.lv === lv); b.appendChild(el('h3', '', `${PLV[lv]} (${ps.filter(p => done[p.id]).length}/${ps.length})`)); const g = el('div', 'grid'); b.appendChild(g);
    ps.forEach(p => { const c = el('div', 'card big'); c.innerHTML = `<b>${done[p.id] ? '✅ ' : ''}${esc(p.title)}</b><small>${esc(p.goal)}</small>`; c.onclick = () => { m.close(); Puz.start(p.id); }; g.appendChild(c); });
  }
  const m = App.modal({ title: '코딩 퍼즐 (' + PUZZLES.length + '개)', body: b, wide: true });

/* ============================================================

var LESSONS = [];
function lesson(id, title, text, demo, practice) {
  practice = Object.assign({ id, lv: 0, title: title + ' 연습', allow: [], need: [], limit: 99, hint: '', cases: [], lesson: true }, practice);
  LESSONS.push({ id, title, text, demo: demo || null, practice });
}

  () => Q(FLAG(), MOVE(50)), { goal: '깃발을 누르면 주인공이 오른쪽으로 50만큼 움직이게 하세요.', allow: [H, 'mv_steps'], limit: 1, need: ['mv_steps'], hint: '왼쪽 팔레트 이벤트 → 깃발 블록, 움직임 → 움직이기 블록을 끌어다 붙이세요.', cases: one(PT.pos(50, 0)) });
lesson('l02', '좌표와 이동', ['무대는 가운데가 (0, 0)인 <b>좌표 평면</b>이에요. x는 오른쪽으로 갈수록, y는 위로 갈수록 커져요.', '"x: y: 위치로 이동하기"는 한 번에 원하는 곳으로 보내고, "x를 □만큼 바꾸기"는 지금 위치에서 조금씩 옮겨요.'],
  () => Q(FLAG(), GOTO(100, 50), CHX(-30)), { goal: '주인공을 x: 60, y: -40 위치로 보내세요.', allow: [H, 'mv_gotoxy'], limit: 1, need: ['mv_gotoxy'], hint: '이동하기 블록의 x와 y 칸에 숫자를 쓰세요. 아래쪽은 음수예요.', cases: one(PT.pos(60, -40)) });
lesson('l03', '방향과 회전', ['스프라이트는 <b>방향</b>을 보고 있어요. 90은 오른쪽, 180은 아래쪽, 0은 위쪽, -90은 왼쪽이에요.', '"움직이기"는 바라보는 방향으로 가요. 회전 블록으로 방향을 바꾼 뒤 움직이면 길이 꺾여요.'],
  () => Q(FLAG(), K('mv_cw', { N: 90 }), MOVE(40)), { goal: '180도 돌고 30만큼 움직여 주인공이 왼쪽 (-30, 0)에 가게 하세요.', allow: [H, 'mv_cw', 'mv_ccw', 'mv_steps', 'mv_point'], limit: 2, need: ['mv_steps'], hint: '시계 방향 180도 회전 뒤 30만큼 움직이기.', cases: one(PT.pos(-30, 0)) });
lesson('l04', '말하기', ['"말하기" 블록은 스프라이트 옆에 말풍선을 띄워요. 안내나 결과 표시에 자주 써요.', '"□초 동안 말하기"는 시간이 지나면 말풍선이 사라져요.'],
  () => Q(FLAG(), SAY('안녕!')), { goal: '주인공이 "반가워"라고 말하게 하세요.', allow: [H, 'lk_say', 'lk_sayfor'], limit: 1, need: [], hint: '형태 분류의 말하기 블록 글자를 바꾸세요.', cases: one(PT.said(['반가워'])) });
lesson('l05', '반복하기', ['같은 일을 여러 번 하려면 <b>반복</b> 블록을 써요. 블록을 10개 늘어놓는 대신 "10번 반복하기" 안에 하나만 넣으면 돼요.', '반복 블록은 C자 모양이에요. 반복할 블록을 안쪽에 끼워 넣으세요.'],
  () => Q(FLAG(), REP(10, MOVE(5))), { goal: '5만큼 움직이기를 8번 반복해서 x=40에 가게 하세요.', allow: [H, 'ct_repeat', 'mv_steps'], limit: 2, need: ['ct_repeat'], hint: '8번 반복하기 안에 5만큼 움직이기.', cases: one(PT.pos(40, 0)) });
lesson('l06', '변수', ['<b>변수</b>는 값을 담아 두는 이름표 붙은 상자예요. 점수, 목숨, 이름 같은 것을 기억할 때 써요.', '"□을(를) □(으)로 정하기"는 값을 새로 넣고, "□을(를) □만큼 바꾸기"는 지금 값에 더해요. 변수는 [변수] 분류에서 만들 수 있어요.'],
  () => Q(FLAG(), sv_('점수', 0), cv_('점수', 1)), { vars: ['점수'], goal: '변수 "점수"를 7로 정하세요.', allow: [H, 'va_set', 'va_chg'], limit: 1, need: [], hint: '변수 분류의 "정하기" 블록, 값 칸에 7.', cases: one(PT.v('점수', 7)) });
lesson('l07', '연산', ['덧셈·뺄셈·곱셈·나눗셈 같은 계산은 <b>연산</b> 블록이에요. 둥근 값 블록은 다른 블록의 둥근 칸에 끼울 수 있어요.', '변수 블록도 같은 모양이라 계산 안에 넣을 수 있어요.'],
  () => Q(FLAG(), sv_('결과', add(gv('가'), 1))), { vars: [['가', 6], ['나', 7], '결과'], goal: '변수 "결과"에 "가" × "나"를 넣으세요.', allow: [H, 'va_set', 'op_mul', 'va_get'], limit: 1, need: ['op_mul'], hint: '결과을 (가 × 나)로 정하기. 변수 블록을 곱셈 칸에 끼우세요.', cases: [{ over: { 가: 6, 나: 7 }, steps: [{ test: PT.v('결과', 42) }] }, { over: { 가: 3, 나: 5 }, steps: [{ test: PT.v('결과', 15) }] }] });
lesson('l08', '조건문', ['"만약 ~라면" 블록은 조건이 <b>참일 때만</b> 안쪽 블록을 실행해요. "아니면"이 있으면 거짓일 때 다른 일을 해요.', '조건은 육각형 블록(비교·참/거짓)을 끼워 만들어요.'],
  () => Q(FLAG(), IFE(gt(gv('수'), 10), [SAY('크다')], [SAY('작다')])), { vars: [['수', 15]], goal: '변수 "수"가 10보다 크면 "크다", 아니면 "작다"라고 말하세요.', allow: [H, 'ct_ifelse', 'ct_if', 'op_gt', 'op_lt', 'lk_say', 'va_get'], limit: 3, need: [], hint: '만약 (수 > 10) 이라면 크다 / 아니면 작다.', cases: [{ over: { 수: 15 }, steps: [{ test: PT.said(['크다']) }] }, { over: { 수: 3 }, steps: [{ test: PT.said(['작다']) }] }, { over: { 수: 10 }, steps: [{ test: PT.said(['작다']) }] }] });
lesson('l09', '리스트', ['<b>리스트</b>는 여러 값을 순서대로 담는 목록이에요. 번호(1부터)로 꺼낼 수 있어요.', '"□을(를) 리스트에 추가하기"로 맨 뒤에 넣어요.'],
  () => Q(FLAG(), K('li_add', { X: '사과', L: '과일' })), { lists: [['과일', []]], goal: '리스트 "과일"에 사과, 배, 포도를 이 순서로 넣으세요.', allow: [H, 'li_add'], limit: 3, need: ['li_add'], hint: '추가하기 블록 3개. 각각 글자를 바꾸세요.', cases: one(PT.l('과일', ['사과', '배', '포도'])) });
lesson('l10', '키보드 입력', ['"□ 키를 눌렀을 때" 모자 블록으로 키보드에 반응해요. 게임에서 캐릭터를 조작할 때 써요.', '키를 바꾸려면 블록의 드롭다운을 눌러 고르세요.'],
  () => Q(K('ev_key', { KEY: 'up' }), CHY(10)), { goal: '↑ 키를 누를 때마다 주인공이 위로 10씩 올라가게 하세요. (두 번 누르면 y=20)', allow: ['ev_key', 'mv_y'], limit: 1, need: ['ev_key'], hint: '키를 "위쪽 화살표"로 바꾸고 y를 10만큼 바꾸기.', cases: [{ steps: [{ keys: ['up'] }, { keys: ['up'], test: PT.pos(0, 20) }] }] });
lesson('l11', '메시지 방송', ['스프라이트끼리 신호를 주고받을 땐 <b>메시지</b>를 써요. 한쪽이 "방송하기", 다른 쪽이 "메시지를 받았을 때"로 반응해요.', '여러 스프라이트가 동시에 같은 메시지에 반응할 수 있어요.'],
  () => Q(K('ev_key', { KEY: 'space' }), K('ev_send', { MSG: '시작' })), { msgs: ['신호'], extra(P) { addSp(P, '빨간 공', '친구', 120, 0, [Q(K('ev_msg', { MSG: '신호' }), SAY('신호 받음'))], { size: 70 }); }, goal: '스페이스 키를 누르면 "신호" 메시지를 방송하세요. 친구가 "신호 받음"이라고 말해요.', allow: ['ev_key', 'ev_send'], limit: 1, need: ['ev_send'], hint: '키 모자 아래에 "신호 메시지 방송하기".', cases: [{ steps: [{ keys: ['space'], test: PT.said(['신호 받음']) }] }] });
lesson('l12', '복제', ['<b>복제</b>는 스프라이트를 똑같이 하나 더 만드는 거예요. 별, 총알, 적을 많이 만들 때 편해요.', '복제본은 "복제되었을 때" 모자 블록의 스크립트를 따로 실행해요.'],
  () => Q(FLAG(), REP(3, K('cl_make', { T: '_self_' }))), { goal: '주인공을 3번 복제해서 복제본이 3개가 되게 하세요.', allow: [H, 'ct_repeat', 'cl_make'], limit: 2, need: ['cl_make'], hint: '3번 반복 { 나 자신 복제하기 }', cases: one(PT.fn(rt => rt.insts.filter(i => i.isClone).length === 3, '복제본이 정확히 3개여야 합니다.')) });
lesson('l13', '펜으로 그리기', ['펜 블록은 스프라이트가 지나간 자리에 <b>선을 그려요</b>. "펜 내리기"를 하면 그리기 시작, "펜 올리기"를 하면 멈춰요.', '움직이기와 회전을 반복하면 도형을 그릴 수 있어요.'],
  () => Q(FLAG(), K('pn_down'), MOVE(60)), { goal: '펜을 내리고 오른쪽으로 100만큼 선을 그리세요.', allow: [H, 'pn_down', 'mv_steps'], limit: 2, need: ['pn_down', 'mv_steps'], hint: '펜 내리기 → 100만큼 움직이기. (순서가 중요해요!)', cases: one(PT.pen([[25, 0], [50, 0], [75, 0]], [[50, 30]])) });
lesson('l14', '나만의 블록', ['같은 블록 묶음을 자주 쓴다면 <b>내 블록</b>으로 만들어요. [내 블록] 분류에서 "블록 만들기"를 누르고 이름을 정하면 정의 모자 블록이 생겨요.', '정의 아래에 실행할 블록을 붙이고, 사용할 땐 만든 블록을 끌어다 쓰면 돼요.'],
  () => K('cu_def', {}, { proc: '인사', params: [], n: Q(SAY('안녕!')) }), { goal: '"인사" 블록을 만들어(안에서 "안녕"이라고 말하기) 깃발을 누르면 호출하세요.', allow: [H, 'cu_def', 'cu_call', 'lk_say'], limit: 2, need: ['cu_def', 'cu_call'], hint: '내 블록 → 블록 만들기 → 이름 "인사". 정의 아래에 말하기를 붙이고, 깃발 아래에서 인사 블록을 호출하세요.', cases: one(PT.said(['안녕'])) });
lesson('l15', '디버깅: 오류 찾기', ['프로그램이 생각대로 안 될 땐 <b>디버깅</b>을 해요. 실행 중인 블록은 노랗게 빛나고, 아래 콘솔에 오류가 표시돼요.', '⏸ 일시정지와 한 단계씩 실행 버튼, 블록 우클릭 → 중단점으로 한 줄씩 따라가 보세요.', '아래 연습에는 일부러 틀린 프로그램이 들어 있어요. 어디가 틀렸는지 찾아 고치세요.'],
  null, { extra(P) { P.sprites[0].scripts = [{ id: uid(), x: 20, y: 20, b: Q(FLAG(), REP(5, MOVE(10))) }]; }, goal: '주인공이 x=100까지 가야 하는데 지금은 50에서 멈춰요. 프로그램을 고치세요.', allow: [], limit: 2, need: ['ct_repeat'], hint: '반복 횟수를 10으로 바꾸거나, 움직이는 양을 20으로 바꾸세요.', cases: one(PT.pos(100, 0)) });

/* ---------- 고급 튜토리얼 (16~20) ---------- */
lesson('l16', '[고급] 재귀 함수', ['<b>재귀</b>는 블록이 <b>자기 자신을 다시 부르는</b> 방법이에요. 큰 문제를 같은 모양의 작은 문제로 줄여 풀어요.', '반드시 <b>멈추는 조건</b>(기저 조건)이 있어야 해요. 예: 합(n) = n + 합(n-1), 합(0) = 0.', '"값을 돌려주는 블록"을 만들고, 안에서 자기 자신(값 블록)을 호출하세요.'],
  null, { vars: [['N', 5], '결과'], goal: '값을 돌려주는 블록 "합"(입력 "n")을 재귀로 만들어 1+2+…+n을 계산하고, 변수 "결과"에 합(N)을 넣으세요.', allow: [H, 'va_set', 'cu_def', 'cu_callr', 'cu_return', 'cu_arg', 'ct_if', 'ct_ifelse', 'op_eq', 'op_add', 'op_sub', 'op_gt', 'op_lt', 'va_get'], limit: 6, need: ['cu_def', 'cu_callr', 'cu_callr', 'cu_return'], hint: '정의: 만약 (n = 0) 이라면 0 반환. 그 밖에는 (n + 합(n - 1)) 반환. 깃발: 결과 ← 합(N). 호출 블록이 정의 안에도, 깃발 아래에도 있어야 해요.', cases: [[5, 15], [1, 1], [0, 0], [10, 55]].map(([n, r]) => ({ over: { N: n }, steps: [{ test: PT.v('결과', r) }] })) });
lesson('l17', '[고급] 화면 새로고침 없이 실행', ['보통 반복 블록은 <b>한 번 돌 때마다 화면을 한 번 갱신</b>해요. 그래서 200번 반복하면 약 3초가 걸려요. 움직임이 보여야 하는 애니메이션에는 좋지만, 계산만 하는 블록에는 느려요.', '내 블록을 만들 때 실행 방식을 <b>⚡ 화면 새로고침 없이</b>로 고르면, 블록 안의 반복이 화면 갱신 없이 한 번에 끝나요. (정의 블록의 칩을 눌러 나중에 바꿀 수도 있어요.)', '"기다리기"는 새로고침 없이 모드에서도 그대로 기다리고, 끝나지 않는 계산이 있어도 아주 짧은 시간마다 화면과 다른 스크립트에 차례를 넘겨서 멈추지 않아요(정지 버튼도 항상 작동).'],
  null, { vars: ['점수'], goal: '"세기" 블록을 만들어 그 안에서 점수를 1씩 200번 올리세요. 블록을 ⚡ 화면 새로고침 없이 실행으로 설정하면 0.6초 안에 점수가 200이 돼요.', allow: [H, 'cu_def', 'cu_call', 'ct_repeat', 'va_chg'], limit: 3, need: ['cu_def', 'cu_call', 'ct_repeat'], hint: '내 블록 만들기 → 실행 방식에서 "화면 새로고침 없이" 선택. 정의 안: 200번 반복 { 점수 1 증가 }. 깃발 아래서 세기 호출.', cases: [{ steps: [{ wait: 600, test: PT.v('점수', 200) }] }] });
lesson('l18', '[고급] 방송하고 기다리기', ['"메시지 방송하기"는 보내기만 하고 <b>바로 다음 블록</b>으로 가요. 받는 쪽 일이 끝나기를 기다리려면 <b>"방송하고 기다리기"</b>를 써요.', '여러 스프라이트가 순서대로 일해야 할 때(이야기, 게임 시작 연출) 꼭 필요해요.'],
  null, { msgs: ['일'], extra(P) { addSp(P, '빨간 공', '친구', 120, 0, [Q(K('ev_msg', { MSG: '일' }), WAIT(0.5), SAY('일 끝'))], { size: 70 }); }, goal: '깃발을 누르면 "일" 메시지를 방송하고 친구가 끝낼 때까지 기다린 뒤, 주인공이 "다 끝났어요"라고 말하게 하세요. (말하는 순서: 일 끝 → 다 끝났어요)', allow: [H, 'ev_send', 'ev_sendwait', 'lk_say'], limit: 2, need: ['ev_sendwait'], hint: '"일 메시지 방송하고 기다리기" 다음에 "다 끝났어요 말하기".', cases: [{ steps: [{ max: 5000, test: PT.said(['일 끝', '다 끝났어요']) }] }] });
lesson('l19', '[고급] 사용자 입력 받기', ['"□라고 묻고 기다리기"는 무대에 입력창을 띄우고, 사용자가 글을 쓰고 확인할 때까지 기다려요. 입력한 글은 <b>"대답"</b> 블록으로 꺼내요.', '대답은 다음 질문을 하면 바뀌니, 오래 쓸 값은 변수에 저장하세요.'],
  null, { goal: '"이름이 뭐예요?"라고 묻고, 대답 앞에 "안녕, "을 결합해서 말하게 하세요. (철수 → 안녕, 철수)', allow: [H, 'se_ask', 'se_answer', 'op_join', 'lk_say'], limit: 2, need: ['se_ask', 'se_answer', 'op_join'], hint: '묻기 → ("안녕, " 와 대답 결합)을 말하기.', cases: [{ steps: [{ ask: '철수', max: 4000, test: PT.said(['안녕, 철수']) }] }, { steps: [{ ask: '영희', max: 4000, test: PT.said(['안녕, 영희']) }] }] });
lesson('l20', '[고급] 글상자로 점수판 만들기', ['말풍선과 달리 <b>글상자</b>는 원하는 위치·크기에 이름을 붙여 만드는 화면 요소예요. 점수판, 안내문, 버튼, 입력창을 만들 수 있어요.', '"글상자 □ 만들기"로 만들고, "□의 글을 □(으)로 정하기"로 내용을 바꿔요. 변수 값을 보여 주려면 글 결합과 함께 쓰세요.'],

/* ============================================================
 * Online storage via Supabase (optional, user-supplied server)
 * Uses only Supabase's public REST API. Needs the table in CLOUD_SQL.
 * ============================================================ */
const CLOUD_SQL = `create table public.bsx_projects (
  id text primary key,
  owner uuid not null default auth.uid() references auth.users(id) on delete cascade,
  name text not null,
  data jsonb not null,
  updated_at timestamptz not null default now()
);
alter table public.bsx_projects enable row level security;
create policy "own projects" on public.bsx_projects
  for all using (owner = auth.uid()) with check (owner = auth.uid());`;
var Cloud = {
  cfg() { const S = App.settings; S.cloud = S.cloud || { url: '', key: '', sess: null }; return S.cloud; },
  base() { return Cloud.cfg().url.replace(/\/+$/, ''); },
  async req(path, o, retry) {
    const c = Cloud.cfg(); if (!c.url || !c.key) throw new Error('서버 주소와 anon 키를 먼저 입력하세요.');
    const h = Object.assign({ apikey: c.key, 'Content-Type': 'application/json' }, o && o.headers || {}); if (c.sess && !(o && o.noauth)) h.Authorization = 'Bearer ' + c.sess.access_token;
    let r; try { r = await fetch(Cloud.base() + path, Object.assign({}, o, { headers: h })); } catch (e) { throw new Error('서버에 연결할 수 없습니다. 주소와 인터넷 연결을 확인하세요.'); }
    if (r.status === 401 && c.sess && c.sess.refresh_token && !retry && !(o && o.noauth)) { try { await Cloud.refresh(); } catch (_) { c.sess = null; App.saveSettings(); throw new Error('로그인이 만료되었습니다. 다시 로그인하세요.'); } return Cloud.req(path, o, true); }
    const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (_) { }
    if (!r.ok) throw new Error((j && (j.msg || j.message || j.error_description || j.error)) || ('서버 오류 ' + r.status));
    return j;
  },
  setSess(j) { if (!j || !j.access_token) return false; Cloud.cfg().sess = { access_token: j.access_token, refresh_token: j.refresh_token, email: (j.user && j.user.email) || '', exp: Date.now() + (j.expires_in || 3600) * 1000 }; App.saveSettings(); return true; },
  async refresh() { const j = await Cloud.req('/auth/v1/token?grant_type=refresh_token', { method: 'POST', noauth: true, body: JSON.stringify({ refresh_token: Cloud.cfg().sess.refresh_token }) }, true); if (!Cloud.setSess(j)) throw new Error('refresh failed'); },
  async login(email, pw, signup) {
    const j = await Cloud.req(signup ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password', { method: 'POST', noauth: true, body: JSON.stringify({ email, password: pw }) });
    if (!Cloud.setSess(j)) { if (signup) throw new Error('가입 요청을 보냈습니다. 확인 메일이 오면 링크를 누른 뒤 로그인하세요.'); throw new Error('로그인 응답이 올바르지 않습니다.'); }
  },
  async save() {
    const P = JSON.parse(JSON.stringify(App.project)); P.modified = Date.now(); const body = JSON.stringify({ id: P.id, name: P.name || '이름 없음', data: P, updated_at: new Date().toISOString() });
    if (body.length > 20e6) throw new Error('프로젝트가 너무 큽니다(20MB 초과). 소리·이미지를 줄여 보세요.');
    await Cloud.req('/rest/v1/bsx_projects?on_conflict=id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body });
  },
  async list() { return (await Cloud.req('/rest/v1/bsx_projects?select=id,name,updated_at&order=updated_at.desc', { method: 'GET' })) || []; },
  async get(id) { const r = await Cloud.req('/rest/v1/bsx_projects?select=data&id=eq.' + encodeURIComponent(id), { method: 'GET' }); if (!r || !r[0]) throw new Error('프로젝트를 찾을 수 없습니다.'); return r[0].data; },
  async del(id) { await Cloud.req('/rest/v1/bsx_projects?id=eq.' + encodeURIComponent(id), { method: 'DELETE' }); },
  logout() { Cloud.cfg().sess = null; App.saveSettings(); },
  dialog() {
    const c = Cloud.cfg(), b = el('div'); let m;
    const draw = () => {
      const s = c.sess;
      b.innerHTML = `<p class="hint">내 Supabase 서버에 프로젝트를 저장합니다. (선택 기능 — 없어도 모든 기능을 쓸 수 있어요.) 서버 주소와 공개(anon) 키는 이 기기의 브라우저에만 저장돼요. <b>이 기능은 인터넷이 필요하고, 사용자가 준비한 서버가 있어야 작동합니다.</b></p>
      <details><summary>서버 준비 방법 (처음 한 번)</summary><ol><li>supabase.com에서 프로젝트를 만듭니다.</li><li>SQL Editor에 아래 코드를 붙여 넣고 실행합니다.</li><li>Project Settings → API에서 URL과 anon public 키를 복사해 아래에 넣습니다.</li></ol><textarea readonly style="width:100%;height:150px;font-family:monospace;font-size:11px">${esc(CLOUD_SQL)}</textarea></details>
      <div class="field"><label>서버 주소 (https://….supabase.co)</label><input id="cl_url" type="url" value="${esc(c.url)}"></div>
      <div class="field"><label>anon public 키</label><input id="cl_key" type="text" value="${esc(c.key)}"></div>
      ${s ? `<p>✅ <b>${esc(s.email || '로그인됨')}</b> 로 로그인되어 있어요.</p><div class="row2" style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn pri" id="cl_save">☁ 현재 프로젝트 저장</button><button class="btn" id="cl_list">내 프로젝트 목록</button><button class="btn" id="cl_out">로그아웃</button></div>` : `<div class="field"><label>이메일</label><input id="cl_mail" type="email" autocomplete="username"></div><div class="field"><label>비밀번호 (6자 이상)</label><input id="cl_pw" type="password" autocomplete="current-password"></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn pri" id="cl_in">로그인</button><button class="btn" id="cl_up">가입</button></div>`}<div id="cl_out_box" style="margin-top:10px"></div>`;
      const $ = q => b.querySelector(q), say = (t, err) => { $('#cl_out_box').innerHTML = `<p class="hint" style="color:${err ? '#dc2626' : 'inherit'}">${esc(t)}</p>`; };
      const conn = () => { let u = $('#cl_url').value.trim(), k = $('#cl_key').value.trim(); if (!/^https:\/\//i.test(u)) { say('서버 주소는 https:// 로 시작해야 합니다.', true); return false; } c.url = u; c.key = k; App.saveSettings(); return true; };
      const run = async (f, ok) => { try { await f(); if (ok) say(ok); } catch (e) { say(e.message, true); } };
      $('#cl_url').onchange = $('#cl_key').onchange = () => { if (/^https:\/\//i.test($('#cl_url').value.trim())) { c.url = $('#cl_url').value.trim(); c.key = $('#cl_key').value.trim(); App.saveSettings(); } };
      if (s) {

          rows.forEach(r => { const d = el('div'); d.style.cssText = 'display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)'; d.innerHTML = `<span style="flex:1"><b>${esc(r.name)}</b><br><small class="hint">${esc(new Date(r.updated_at).toLocaleString())}</small></span>`; const o = el('button', 'btn pri', '열기'), x = el('button', 'btn', '삭제');

            x.onclick = () => App.confirm(`"${r.name}"을(를) 서버에서 삭제할까요? 되돌릴 수 없어요.`, () => run(async () => { await Cloud.del(r.id); d.remove(); }, '삭제했습니다.'));
            d.appendChild(o); d.appendChild(x); box.appendChild(d); });

  s.innerHTML = `<div class="sw"><div style="display:flex;justify-content:flex-end"><button class="btn" id="stClose" style="display:${App.project && document.body.classList.contains('in-editor') ? '' : 'none'}">✕ 편집기로 돌아가기</button></div>
  <h1>Block Studio <span>X</span></h1><p class="sub">블록으로 코딩하고, 실행하고, 저장하고, 내보내세요. 게임과 프로그램을 만드는 블록코딩 IDE</p>
  <div class="sgrid"><button class="sbtn" data-a="new"><span class="em">✨</span><b>새 프로젝트</b><small>기본 스프라이트와 빈 무대</small></button><button class="sbtn" data-a="ex"><span class="em">🎮</span><b>예제 프로젝트</b><small>바로 실행하고 고쳐 보기</small></button><button class="sbtn" data-a="open"><span class="em">📂</span><b>프로젝트 불러오기</b><small>저장 목록 · .bsx 파일</small></button><button class="sbtn" data-a="learn"><span class="em">🎓</span><b>학습하기</b><small>단계별 튜토리얼</small></button><button class="sbtn" data-a="puz"><span class="em">🧩</span><b>코딩 퍼즐</b><small>직접 풀며 배우기</small></button><button class="sbtn" data-a="set"><span class="em">⚙</span><b>설정</b><small>테마 · 자동 저장 · 성능</small></button></div>
  <h3>최근 프로젝트</h3><div class="rec" id="stRec">${recent.length ? '' : '<span style="opacity:.7">아직 저장된 프로젝트가 없습니다. 새 프로젝트를 만들어 보세요!</span>'}</div>
  <p style="opacity:.6;margin-top:30px;font-size:13px">단일 HTML · 서버 없이 작동 · 프로젝트는 이 브라우저(IndexedDB)에 저장됩니다. 중요한 작업은 "파일 → .bsx 다운로드"로 백업하세요.</p></div>`;
  const rec = s.querySelector('#stRec'); recent.forEach(r => { const c = el('div', 'rcard'); c.innerHTML = `<div class="th">${r.thumb ? `<img alt="" src="${r.thumb}">` : '📄'}</div><b>${esc(r.name)}</b><small>${new Date(r.modified).toLocaleDateString('ko-KR')}</small>`; c.onclick = async () => { const f = await Store.get(r.id); try { App.loadProject(JSON.parse(f.data)); } catch (e) { App.toast('열 수 없는 프로젝트: ' + e.message, 'err'); } }; rec.appendChild(c); });
  s.onclick = e => { const a = e.target.closest('[data-a]'); if (e.target.id === 'stClose') { s.classList.remove('on'); return; } if (!a) return; const k = a.dataset.a;
    if (k === 'new') { if (!App.project || !document.body.classList.contains('in-editor')) { App.loadProject(newProject('내 프로젝트')); } else App.newProjectDialog(); } else if (k === 'ex') { if (!App.project || !document.body.classList.contains('in-editor')) App.loadProject(newProject('내 프로젝트'), { silent: true }); Learn.examples(); } else if (k === 'open') { if (!document.body.classList.contains('in-editor')) App.loadProject(newProject('내 프로젝트'), { silent: true }); Store.openDialog(); } else if (k === 'learn') { if (!document.body.classList.contains('in-editor')) App.loadProject(newProject('학습 연습'), { silent: true }); Learn.tutorials(); } else if (k === 'puz') { if (!document.body.classList.contains('in-editor')) App.loadProject(newProject('퍼즐'), { silent: true }); Learn.puzzles(); } else if (k === 'set') App.settingsDialog(); };
};
App.settingsDialog = function () {
  const S = App.settings; const b = el('div'); b.innerHTML = `<div class="field"><label>테마</label><select id="s1"><option value="light">라이트 모드</option><option value="dark">다크 모드</option></select></div><div class="field"><label>작업 공간 배경</label><select id="s2"><option value="grid">점 격자</option><option value="paper">종이</option><option value="blueprint">청사진</option></select></div>
  <div class="field"><label>블록 크기 / 글꼴 크기 (<span id="s3v">${S.blockSize}</span>px)</label><input type="range" id="s3" min="11" max="22" value="${S.blockSize}"></div><div class="field row"><input type="checkbox" id="s4" ${S.autosave ? 'checked' : ''}><label for="s4">자동 저장</label></div><div class="field"><label>자동 저장 간격(초)</label><input type="number" id="s5" min="2" max="120" value="${S.autosaveSec}"></div>
  <div class="field"><label>최대 복제본 수 (성능 설정)</label><input type="number" id="s6" min="10" max="2000" value="${S.maxClones}"></div><div class="field row"><input type="checkbox" id="s7" ${S.allowNet ? 'checked' : ''}><label for="s7">프로젝트의 외부 데이터 요청(https) 허용 — 켜면 "웹 주소 가져오기" 블록이 작동합니다</label></div><div class="field row"><input type="checkbox" id="s8" ${S.pauseOnError ? 'checked' : ''}><label for="s8">오류가 나면 실행 일시정지</label></div>
  <hr><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" id="s9">☁ 온라인 저장 설정</button><button class="btn danger" id="s10">↺ 초기 설정 복원</button></div>`;
  b.querySelector('#s1').value = S.theme; b.querySelector('#s2').value = S.wstheme; b.querySelector('#s3').oninput = e => b.querySelector('#s3v').textContent = e.target.value;
  b.querySelector('#s9').onclick = () => Cloud.dialog(); b.querySelector('#s10').onclick = () => App.confirm('모든 설정을 초기값으로 되돌릴까요? (프로젝트는 유지됩니다)', () => { App.settings = Object.assign({}, App.DEFAULT_SETTINGS, { tutorialsDone: S.tutorialsDone, puzzlesDone: S.puzzlesDone, achievements: S.achievements, recent: S.recent }); App.saveSettings(); App.applySettings(); App.toast('초기 설정으로 복원했습니다'); });
  App.modal({ title: '설정', body: b, buttons: [{ text: '취소' }, { text: '적용', cls: 'pri', fn: () => { Object.assign(S, { theme: b.querySelector('#s1').value, wstheme: b.querySelector('#s2').value, blockSize: +b.querySelector('#s3').value, autosave: b.querySelector('#s4').checked, autosaveSec: clamp(+b.querySelector('#s5').value || 8, 2, 120), maxClones: clamp(+b.querySelector('#s6').value || 300, 10, 2000), allowNet: b.querySelector('#s7').checked, pauseOnError: b.querySelector('#s8').checked }); App.saveSettings(); App.applySettings(); Ed.render(); } }] });
};
App.shortcutsDialog = function () {
  const rows = [['Ctrl+Z / Ctrl+Y', '실행 취소 / 다시 실행'], ['Ctrl+C / X / V', '복사 / 잘라내기 / 붙여넣기'], ['Ctrl+D', '선택한 블록 복제'], ['Ctrl+A', '모든 스크립트 선택'], ['Delete', '선택한 블록 삭제'], ['Shift+드래그', '영역으로 여러 스크립트 선택'], ['Shift+클릭', '선택에 추가/제거'], ['더블클릭(C블록)', '접기/펼치기'], ['우클릭 / 길게 누르기', '블록 메뉴 (주석, 브레이크포인트, 즐겨찾기)'], ['Ctrl+F', '블록 검색'], ['+ / −', '작업 공간 확대/축소'], ['Ctrl+0', '확대 초기화'], ['Ctrl+Enter / F5', '실행'], ['F8', '한 단계씩 실행'], ['Esc', '정지'], ['Ctrl+S', '저장'], ['마우스 휠 / 두 손가락', '이동 / 확대·축소']];
  App.modal({ title: '키보드 단축키', body: '<table class="tb">' + rows.map(r => `<tr><td><span class="kbd">${r[0]}</span></td><td>${r[1]}</td></tr>`).join('') + '</table>' });
};
App.helpDialog = function () {
  const feats = [['IndexedDB (프로젝트 저장)', !!window.indexedDB], ['Web Audio (소리 재생·편집)', !!(window.AudioContext || window.webkitAudioContext)], ['마이크 녹음', !!(navigator.mediaDevices && window.MediaRecorder)], ['음성 합성 TTS', 'speechSynthesis' in window], ['음성 인식', !!(window.SpeechRecognition || window.webkitSpeechRecognition)], ['전체 화면', !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)], ['공유 (Web Share)', !!navigator.share], ['링크 압축 공유', !!window.CompressionStream], ['Canvas filter 효과', 'filter' in CanvasRenderingContext2D.prototype]];
  App.modal({ title: '도움말 · 브라우저 호환성', wide: true, body: `<p><b>이 브라우저의 지원 상태</b></p><table class="tb">${feats.map(f => `<tr><td>${f[0]}</td><td>${f[1] ? '✅ 지원' : '❌ 미지원 (해당 기능만 비활성)'}</td></tr>`).join('')}</table><p class="hint">권장: 최신 Chrome / Edge / Safari / Firefox. 마이크·음성 인식은 https 또는 localhost 에서만 허용됩니다. 음성 인식은 Chrome 계열에서 지원됩니다.</p><p><b>자주 묻는 질문</b></p><p>• 프로젝트가 사라졌어요 → 브라우저 사이트 데이터를 지우면 함께 지워집니다. 파일 메뉴의 .bsx 다운로드로 백업하세요.<br>• 블록이 연결되지 않아요 → 모자 블록(🏁)은 맨 위에만, 끝 블록(반복 탈출 등)은 맨 아래에만 올 수 있습니다. 연결 불가 위치는 빨간 선으로 표시됩니다.<br>• 무한 반복이 걱정돼요 → 반복마다 화면이 갱신되어 멈추지 않으며, 값 계산 중 무한 반복은 자동 중단됩니다.</p>` });
};
App.manualDialog = function () {
  App.modal({ title: '사용 설명서', wide: true, body: `<div class="lesson"><h2>빠른 시작</h2><ol><li>왼쪽 팔레트에서 <b>이벤트 → 🏁 깃발을 클릭했을 때</b> 블록을 작업 공간으로 끌어 놓습니다.</li><li>그 아래로 <b>움직임/모양</b> 블록을 끌어 붙이면 자석처럼 달라붙습니다.</li><li>위 🏁 버튼(또는 Ctrl+Enter)으로 실행합니다. 실행 중인 블록은 노랗게 빛납니다.</li><li>블록을 클릭하면 그 스크립트만 바로 실행됩니다.</li></ol><h2>구성</h2><p><b>무대</b>: 프로그램이 실행되는 화면 — 스프라이트를 끌어 위치를 바꿀 수 있어요(정지 상태). <b>스프라이트 패널</b>: 추가·삭제·복제·그룹. <b>모양/소리 탭</b>: 그림 그리기, 녹음, 편집. <b>하단 패널</b>: 콘솔·변수·디버거·성능.</p><h2>고급</h2><p><b>내 블록</b>(함수·재귀), <b>복제본</b>, <b>메시지 방송</b>, <b>펜</b>, <b>리스트</b>, <b>글상자/버튼</b>, <b>TTS</b>, <b>물리·카메라·파티클</b>, <b>오류 처리</b>(시도하기) 등. 완성하면 <b>파일 → 독립 실행 HTML 내보내기</b>로 앱 없이 실행되는 파일을 만드세요.</p></div>` });
};
App.disabledNotice = function (n) { App.toast(n + ' 기능은 이 빌드에 아직 포함되지 않았습니다', 'warn'); };

/* ---------- boot ---------- */
(async function boot() {
  App.loadSettings(); App.applySettings(); Ed.init($('ws')); App.buildMenus(); App.bindStageBar(); App.bindStage(); App.bindSplitters(); App.bindDock();
  Ed.onRender = () => { }; Ed.afterSnap = null;
  App.project = newProject('내 프로젝트'); $('pname').value = App.project.name; App.stageAspect(); App.select(App.project.sprites[0].id); App.ensureRuntime(); App.setTab('code');
  Pal.render(); App.showSaved();
  window.addEventListener('beforeunload', e => { if (App.dirty && document.body.classList.contains('in-editor')) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('error', e => { try { App.log('error', '예상치 못한 오류: ' + e.message); } catch (_) { } });
  window.addEventListener('unhandledrejection', e => { try { App.log('warn', '비동기 오류: ' + (e.reason && e.reason.message || e.reason)); } catch (_) { } });
  document.addEventListener('visibilitychange', () => { if (document.hidden && App.dirty && document.body.classList.contains('in-editor')) App.save(false); });
  if (location.hash.startsWith('#p=')) { await Share.loadFromHash(); } else App.showStart();
})();


</script>
